# Run MCP Machine with `podman compose up -d` (or `make compose-up`).
#
# Two directories are mounted:
#   ./config  -> /etc/mcp-machine (read-only). The admin files: put config.yaml
#             here (start from config.example.yaml) and optional drop-ins in
#             ./config/config.d/*.yaml (see config.example.d/).
#   ./data    -> /data. Writable state; the web UI writes the servers it adds or
#             edits to ./data/config.d/<name>.yaml, one file per server.
# Create both directories before `up`. The ./config mount is optional and
# ./config may stay empty: without a config there, MCP Machine falls back to
# ./data/config.yaml (the deprecated location) with a deprecation warning, or,
# if that is absent too, starts with defaults and a "no configuration found"
# warning.
# The Podman API socket must be active on the host:
#   sudo systemctl enable --now podman.socket
services:
  mcp-machine:
    image: ghcr.io/kenmoini/mcp-machine:latest
    ports:
      - "8080:8080"
    volumes:
      - /run/podman/podman.sock:/run/podman/podman.sock
      - ./config:/etc/mcp-machine:ro
      - ./data:/data
    security_opt:
      - label=disable
    restart: unless-stopped
    # Secrets are referenced from the config files as ${VAR} and resolved from this
    # container's environment, or as ${vault:PATH#KEY} and read from HashiCorp
    # Vault / OpenBao (see docs/config.md, "Secrets from Vault"). Uncomment and
    # set what your config uses.
    # environment:
    #   GHCR_USER: ${GHCR_USER}
    #   GHCR_TOKEN: ${GHCR_TOKEN}
    #   GITHUB_TOKEN: ${GITHUB_TOKEN}
    #   VAULT_ADDR: https://vault.lan:8200     # or vault.address in config.yaml
    #   VAULT_TOKEN: ${VAULT_TOKEN}            # or vault.token_file / vault.approle
