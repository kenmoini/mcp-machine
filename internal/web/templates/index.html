{{define "content"}}
<h1>Servers</h1>
<table>
  <thead>
    <tr><th>Name</th><th>Type</th><th>State</th><th>Image</th><th>Since</th><th>Restarts</th><th>Actions</th></tr>
  </thead>
  <tbody>
  {{range .}}{{template "_server_row.html" .}}
  {{else}}
    <tr><td colspan="7" class="empty">No servers configured.</td></tr>
  {{end}}
  </tbody>
</table>
{{end}}
