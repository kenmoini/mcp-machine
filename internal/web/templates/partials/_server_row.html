<tr id="row-{{.Name}}"{{if not .ActionError}} hx-get="/servers/{{.Name}}/status?view=row" hx-trigger="every 2s" hx-swap="outerHTML"{{end}}>
  <td><a href="/servers/{{.Name}}">{{.Name}}</a></td>
  <td>{{.Type}}</td>
  <td><span class="badge {{.State}}">{{.State}}</span>{{if .Paused}} <span class="tag">paused</span>{{end}}
    {{if or .ActionError .Error}}<div class="err">{{if .ActionError}}{{.ActionError}}{{else}}{{.Error}}{{end}}</div>{{end}}</td>
  <td class="mono">{{.Image}}</td>
  <td>{{since .Since}}</td>
  <td>{{.Restarts}}</td>
  <td class="actions">
    {{- $t := printf "#row-%s" .Name}}
    <button hx-post="/servers/{{.Name}}/actions/start" hx-target="{{$t}}" hx-swap="outerHTML">Start</button>
    <button hx-post="/servers/{{.Name}}/actions/stop" hx-target="{{$t}}" hx-swap="outerHTML">Stop</button>
    <button hx-post="/servers/{{.Name}}/actions/restart" hx-target="{{$t}}" hx-swap="outerHTML">Restart</button>
    <button hx-post="/servers/{{.Name}}/actions/resync" hx-target="{{$t}}" hx-swap="outerHTML">Resync</button>
    {{- if .CanRebuild}}
    <button hx-post="/servers/{{.Name}}/actions/rebuild" hx-target="{{$t}}" hx-swap="outerHTML">Rebuild</button>
    {{- end}}
    <button class="danger" hx-post="/servers/{{.Name}}/actions/remove" hx-target="{{$t}}" hx-swap="outerHTML" hx-confirm="Remove {{.Name}}?">Remove</button>
  </td>
</tr>
