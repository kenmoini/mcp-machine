name: CI

on:
  pull_request:
  push:
    branches:
      - main

# One run per ref; a newer push cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOTAGS: remote,containers_image_openpgp,exclude_graphdriver_btrfs,exclude_graphdriver_devicemapper

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # go-version-file honours the `toolchain` line in go.mod.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

      # Tool versions are pinned in the Makefile.
      - name: Install tools
        run: make tools

      - name: Run golangci-lint
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with the race detector
        run: go test -race -count=1 -tags "${GOTAGS}" -covermode=atomic -coverprofile=coverage.out ./...

      - name: Summarise coverage
        run: |
          go tool cover -func=coverage.out > coverage-func.txt
          {
            echo '### Coverage'
            echo '```'
            tail -n 1 coverage-func.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage-func.txt
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # git describe needs the tags.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: |
          BUILDINFO=github.com/kenmoini/mcp-machine/internal/buildinfo
          VERSION="$(git describe --tags --always --dirty)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 go build -buildvcs=false -tags "${GOTAGS}" \
            -ldflags "-s -w -X ${BUILDINFO}.Version=${VERSION} -X ${BUILDINFO}.Commit=${GITHUB_SHA} -X ${BUILDINFO}.Date=${DATE}" \
            -o bin/mcp-machine ./cmd/mcp-machine
          ./bin/mcp-machine version

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: mcp-machine-linux-amd64
          path: bin/mcp-machine
          if-no-files-found: error
          retention-days: 14

  vuln:
    name: Vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Tool versions are pinned in the Makefile.
      - name: Install tools
        run: make tools

      - name: Run govulncheck
        run: make vuln

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMAGE_REF: mcp-machine:ci
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            MCPM_VERSION=ci-${{ github.sha }}
            MCPM_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
