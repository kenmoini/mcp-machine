# The reference git server: log, diff, status, and commits on mounted repositories.
# https://github.com/modelcontextprotocol/servers/tree/main/src/git
# Mount read-write only if you want it to commit.
servers:
  - name: git
    type: command
    command:
      command: uvx
      args: ["mcp-server-git"]
    container:
      volumes: ["/srv/projects:/projects:ro,z"]
