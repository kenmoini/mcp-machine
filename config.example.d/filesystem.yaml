# Example admin drop-in: save as /etc/mcp-machine/config.d/filesystem.yaml.
# A drop-in holds only `servers:`. A server with a new name is added; one with
# the same name as a server in /etc/mcp-machine/config.yaml merges into, field
# by field, the base definition. The web UI writes its own drop-ins to
# /data/config.d/, which load after these and replace a same-named server whole.
servers:
  - name: filesystem
    type: command
    command:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-filesystem", "/projects"]
      env: { LOG_LEVEL: debug }
    container:                         # optional overrides on the generated spec
      volumes: ["/srv/projects:/projects:ro"]   # add ",z" on SELinux hosts: /srv/projects:/projects:ro,z
      image: docker.io/library/node:20
